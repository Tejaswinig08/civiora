<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civiora – Contact Us</title>
    <meta name="description" content="Reach out to the Civiora society management team with your queries or feedback.">


    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
            min-height: 100vh;
        }

        /* ── NAVBAR ─────────────────────────────────────────────────────── */
        .navbar {
            padding: 15px;
            text-align: right;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }
        .navbar a {
            color: #b8860b;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            margin-right: 25px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .navbar a:hover { color: #1a1a1a; }

        /* ── HEADER ─────────────────────────────────────────────────────── */
        .top {
            text-align: center;
            padding: 55px 20px;
            background: linear-gradient(135deg, #bd9537 0%, #f9f295 50%, #b8860b 100%);
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .top h1 { font-size: 2.4rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .top p  { font-size: 1rem; font-weight: 600; margin-top: 8px; letter-spacing: 1px; }

        /* ── CONTENT ─────────────────────────────────────────────────────── */
        .content {
            max-width: 640px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        /* ── FORM CARD ───────────────────────────────────────────────────── */
        .form-card {
            background: #fff;
            border-radius: 18px;
            padding: 38px 34px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.07);
            border: 1px solid #eee;
            animation: fadeUp 0.5s ease;
        }
        .form-card h2 {
            font-size: 21px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 26px;
            padding-bottom: 14px;
            border-bottom: 2px solid #f0e5c0;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── FORM GROUPS ─────────────────────────────────────────────────── */
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #666;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #ddd;
            border-radius: 9px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            background: #fff;
            color: #333;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #b8860b;
            background: #fffdf5;
        }

        /* ── SUBMIT BUTTON ───────────────────────────────────────────────── */
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #bd9537 0%, #f9f295 50%, #b8860b 100%);
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(184,134,11,0.3);
            transition: all 0.3s ease;
            margin-top: 6px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(184,134,11,0.5);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ── TOAST ───────────────────────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 26px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: #2e7d32;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            z-index: 9999;
            transform: translateY(90px);
            opacity: 0;
            transition: transform 0.35s ease, opacity 0.35s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show  { transform: translateY(0); opacity: 1; }
        .toast.error { background: #c62828; }

        /* ── RESPONSIVE ──────────────────────────────────────────────────── */
        @media (max-width: 600px) {
            .top h1 { font-size: 1.7rem; }
            .form-card { padding: 26px 18px; }
        }
    </style>
</head>
<body>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Navbar -->
    <div class="navbar">
        <a onclick="location.href='dashboard.html'">🏠 Dashboard</a>
        <a onclick="logout()">Log Out</a>
    </div>

    <!-- Header -->
    <div class="top">
        <h1>📬 Contact Us</h1>
        <p>Have a query? We'd love to hear from you.</p>
    </div>

    <!-- Form -->
    <div class="content">
        <div class="form-card">
            <h2>✉️ Send us a Message</h2>

            <div class="form-group">
                <label for="contactName">Your Name</label>
                <input type="text" id="contactName" placeholder="Enter your name" autocomplete="name">
            </div>

            <div class="form-group">
                <label for="contactPhone">Phone Number</label>
                <input type="tel" id="contactPhone" placeholder="Enter your phone number" autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="contactEmail">Email ID</label>
                <input type="email" id="contactEmail" placeholder="Enter your email address" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="contactDoubt">Your Query</label>
                <textarea id="contactDoubt" placeholder="Enter your query or feedback here..." rows="4"></textarea>
            </div>

            <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">Submit</button>
        </div>
    </div>

    <script>
        // ── AUTH GUARD ────────────────────────────────────────────────────────
        // Remove the guard below if you want this page to be publicly accessible
        // const userId = localStorage.getItem('userId');
        // if (!userId) { location.href = 'login.html'; }


        // ── FORM HANDLER ──────────────────────────────────────────────────────
            const name   = document.getElementById('contactName').value.trim();
            const phone  = document.getElementById('contactPhone').value.trim();
            const email  = document.getElementById('contactEmail').value.trim();
            const doubt  = document.getElementById('contactDoubt').value.trim();

            // Validation
            if (!name || !phone || !email || !doubt) {
                showToast('⚠️ All fields are required.', 'error');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showToast('⚠️ Please enter a valid email address.', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Sending…';


                showToast('✅ Message sent successfully!', 'success');
                document.getElementById('contactName').value  = '';
                document.getElementById('contactPhone').value = '';
                document.getElementById('contactEmail').value = '';
                document.getElementById('contactDoubt').value = '';
                showToast('❌ Failed to send. Please try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'Submit';
        }

        // ── TOAST ─────────────────────────────────────────────────────────────
        let _toastTimer;
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (type === 'error' ? ' error' : '');
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
        }

        // ── LOGOUT ────────────────────────────────────────────────────────────
        function logout() {
            localStorage.removeItem('userId');
            localStorage.removeItem('role');
            location.href = 'login.html';
        }

        // Allow pressing Enter in any input to submit
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keydown', e => {
                if (e.key === 'Enter') handleSubmit();
            });
        });
    </script>
</body>
</html>
